<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trabajando la caja flexible</title>
    <style>
        /*.contenedor{
            border:2px solid plum;
            padding:10px;
            background:grey;
            display:flex;
            gap:15px;
            justify-content: center;
        }*/

        .contenedor{
            border:2px solid plum;
            padding:10px;
            background:grey;
            display:flex;
            gap:15px;
            justify-content: center;
            align-items: center;
            height:200px;
            flex-direction: column;
        }
        .caja{
            width: 80px;
            height:60px ;
            background: pink;
            color: white;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
    </div>
</body>
</html>
